<!DOCTYPE html>
<html lang="fr" class="scroll-smooth" id="html-root">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- !fiab : metadonnees de securite -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>Page introuvable | FIAB Web Identity</title>
  <meta name="description" content="La page que vous recherchez semble introuvable." />
  <meta name="robots" content="noindex, follow" />
  
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- !fiab : chargement de tailwind css -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primaire: 'var(--couleur-primaire)',
          },
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- !fiab : feuille de style du projet -->
  <link rel="stylesheet" href="style.css" />

  <!-- !fiab : police montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    // !fiab : initialisation du theme
    (function () {
      if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
    })();
  </script>
</head>

<body class="antialiased selection:bg-primaire selection:text-white min-h-screen flex flex-col justify-between">

  <!-- !fiab : barre de navigation minimale pour page d erreur -->
  <nav class="nav-backdrop fixed top-0 left-0 right-0 z-50 px-6 py-5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <span class="text-xl font-bold tracking-tighter text-var">FIAB.</span>
        <span class="text-[10px] tracking-widest uppercase px-2 py-0.5 rounded border border-var text-muted-var">Web Identity</span>
      </a>

      <div class="flex items-center gap-4">
        <!-- !fiab : bascule du theme -->
        <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Changer le thème">
          <span id="themeIcon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </span>
        </button>
        <a href="/" class="hidden md:inline-flex btn-primary px-6 py-2.5 text-xs uppercase tracking-widest">
          Retour à l'accueil
        </a>
      </div>
    </div>
  </nav>

  <!-- !fiab : contenu central 404 -->
  <main class="flex-grow flex items-center justify-center px-6 pt-32 pb-16 text-center">
    <div class="max-w-2xl mx-auto">
      
      <p class="text-xs uppercase tracking-[0.3em] text-muted-var mb-4">Erreur 404</p>
      
      <h1 class="text-7xl md:text-9xl font-light tracking-tighter text-var mb-6">
        4<span class="text-primaire font-semibold">0</span>4
      </h1>

      <h2 class="text-xl md:text-2xl font-light text-var mb-4">
        Page introuvable
      </h2>

      <p class="text-sm text-muted-var font-light leading-relaxed max-w-md mx-auto mb-10">
        L'adresse demandée n'existe pas ou a été déplacée. Vous pouvez regagner l'accueil ou me contacter directement.
      </p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <a href="/" class="btn-primary px-8 py-3.5 text-xs uppercase tracking-widest w-full sm:w-auto">
          Retourner à l'accueil
        </a>
        <a href="/contact/" class="btn-outline px-8 py-3.5 text-xs uppercase tracking-widest w-full sm:w-auto">
          Signaler un lien brisé
        </a>
      </div>

    </div>
  </main>

  <!-- !fiab : pied de page minimaliste -->
  <footer class="py-8 px-6 border-t border-var text-center">
    <p class="text-[10px] md:text-xs tracking-[0.2em] font-light text-muted-var uppercase">
      FIAB Web Identity • Ives Fassinou • Tous droits réservés
    </p>
  </footer>

  <script>
    // !fiab : gestion du theme clair et sombre
    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';

      if (html.classList.contains('light')) {
        html.classList.remove('light');
        icon.innerHTML = MOON;
        localStorage.setItem('theme', 'dark');
      } else {
        html.classList.add('light');
        icon.innerHTML = SUN;
        localStorage.setItem('theme', 'light');
      }
    }

    (function () {
      const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
      if (localStorage.getItem('theme') === 'light') {
        const icon = document.getElementById('themeIcon');
        if (icon) icon.innerHTML = SUN;
      }
    })();
  </script>

</body>

</html>
